name: Linux build
on: workflow_dispatch

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev patchelf build-essential
      - name: The model file that is too big for the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download model-assets -p encoder.onnx -D app/src-tauri/resources/sam
      - name: Install and build
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: lucent-raw-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
